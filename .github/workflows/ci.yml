name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.30.1
          persona: auditor
          min-severity: medium
          online-audits: false
          advanced-security: false
          annotations: true

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
      - run: npm ci
      - name: Install pinned Docker toolchain dependencies
        run: |
          set -euo pipefail
          npm ci --prefix "$GITHUB_WORKSPACE/docker/image-toolchain"
          echo "$GITHUB_WORKSPACE/docker/image-toolchain/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run check:ci-node-versions
      - run: npm run lint
      - run: npm run check:markdown-links
      - run: npm run test:workflows
      - run: npm run test:ci

  docker_artifact_validation:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Configure CI_DOCKER_USERNAME and CI_DOCKER_PASSWORD only as environment
    # secrets in ci-dockerhub; restrict it to main with no required reviewer.
    # Pull requests use a separate environment with no DockerHub secrets.
    environment:
      name: ${{ github.event_name == 'push' && 'ci-dockerhub' || 'ci-readonly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:packaging-verification
      - name: Check for Docker Hub credentials
        id: docker_hub_credentials
        if: github.event_name == 'push'
        env:
          CI_DOCKER_USERNAME: ${{ secrets.CI_DOCKER_USERNAME }}
          CI_DOCKER_PASSWORD: ${{ secrets.CI_DOCKER_PASSWORD }}
        run: |
          if [[ -n "$CI_DOCKER_USERNAME" && -n "$CI_DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are unavailable; anonymous pull limits apply."
          fi
      - name: Authenticate to Docker Hub for base image pulls
        if: github.event_name == 'push' && steps.docker_hub_credentials.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.CI_DOCKER_USERNAME }}
          password: ${{ secrets.CI_DOCKER_PASSWORD }}
      - run: npm run test:integration:docker
