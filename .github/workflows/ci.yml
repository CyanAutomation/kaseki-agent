name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.30.1
          persona: auditor
          min-severity: high
          online-audits: false
          advanced-security: false
          annotations: true

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck ripgrep
      - run: npm ci
      - name: Install pinned Bun for target repository tests
        run: |
          bun_version=$(node -p "require('./docker/image-toolchain/package.json').dependencies.bun")
          npm install --prefix "$RUNNER_TEMP/kaseki-bun" --no-audit "bun@$bun_version"
          echo "$RUNNER_TEMP/kaseki-bun/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run check:ci-node-versions
      - run: npm run lint
      - run: npm run check:markdown-links
      - run: npm run test:workflows
      - run: npm run test:ci

  docker_artifact_validation:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:packaging-verification
      - name: Check for Docker Hub credentials
        id: docker_hub_credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are unavailable; anonymous pull limits apply."
          fi
      - name: Authenticate to Docker Hub for base image pulls
        if: steps.docker_hub_credentials.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: npm run test:integration:docker
