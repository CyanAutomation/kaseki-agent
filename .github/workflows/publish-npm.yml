name: Publish NPM

on:
  workflow_call:
    inputs:
      ref: { description: Immutable release commit to publish, required: true, type: string }
      version: { description: Exact package version to publish, required: true, type: string }

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_name: ${{ steps.version.outputs.package_name }}
      package_file: ${{ steps.pack.outputs.package_file }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Resolve and verify release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          package_version="$(node -p "require('./package.json').version")"
          lockfile_version="$(node -p "require('./package-lock.json').version")"
          lockfile_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "$package_version" != "$version" || "$lockfile_version" != "$version" || "$lockfile_root_version" != "$version" ]]; then
            echo "Release artifacts are not synchronized with $version" >&2; exit 1
          fi
          grep -qE "^#{1,2} \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md is missing $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
      - name: Confirm target version is unpublished
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${VERSION}" version --json >/tmp/existing-version.json 2>/dev/null; then
            cat /tmp/existing-version.json; echo "Target npm version already exists" >&2; exit 1
          fi
      - run: npm run test:publish-smoke
      - name: Capture package metadata
        run: |
          mkdir -p /tmp/npm-publish-diagnostics
          npm pack --dry-run --json > /tmp/npm-publish-diagnostics/npm-pack-dry-run.json
      - name: Pack verified npm package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/npm-package /tmp/npm-publish-diagnostics
          npm pack --json --pack-destination /tmp/npm-package > /tmp/npm-publish-diagnostics/npm-pack.json
          package_file="$(node -e 'const pack = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(pack[0]?.filename ?? "")' /tmp/npm-publish-diagnostics/npm-pack.json)"
          [[ "$package_file" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "Invalid npm package artifact filename" >&2; exit 1; }
          [[ -f "/tmp/npm-package/$package_file" ]] || { echo "npm package artifact is missing" >&2; exit 1; }
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: /tmp/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-publish-build-metadata
          path: /tmp/npm-publish-diagnostics/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm config delete always-auth || true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: /tmp/npm-package
      - name: Publish exact verified package
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.package_file }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_FILE" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "Invalid npm package artifact filename" >&2; exit 1; }
          PACKAGE_TARBALL="/tmp/npm-package/$PACKAGE_FILE"
          [[ -f "$PACKAGE_TARBALL" ]] || { echo "Verified npm package artifact is missing" >&2; exit 1; }
          npm publish "$PACKAGE_TARBALL" --access public --provenance --loglevel verbose --ignore-scripts

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-publish-build-metadata
          path: /tmp/npm-publish-diagnostics
      - name: Verify published package
        env:
          KASEKI_VERIFY_DEBUG: "0"
          KASEKI_NPM_VERIFY_METADATA_FILE: /tmp/npm-publish-diagnostics/npm-view.json
          VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/npm-verify-publish.sh "$(node -p "require('./package.json').name")" "$VERSION" 300
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-publish-metadata
          path: /tmp/npm-publish-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
