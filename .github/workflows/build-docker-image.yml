name: Publish Docker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref: { description: Immutable release commit to build, required: true, type: string }
      version: { description: Release version without a leading v, required: true, type: string }
  schedule:
    - cron: '0 0 * * 0'

env:
  DOCKER_IMAGE: cyanautomation/kaseki-agent
  NODE_VERSION: "24"

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tree_sitter_version: ${{ steps.metadata.outputs.tree_sitter_version }}
      cache_scope: ${{ steps.metadata.outputs.cache_scope }}
      candidate_hub_tags: ${{ steps.metadata.outputs.candidate_hub_tags }}
      candidate_ghcr_tags: ${{ steps.metadata.outputs.candidate_ghcr_tags }}
      promotion_hub_tags: ${{ steps.metadata.outputs.promotion_hub_tags }}
      promotion_ghcr_tags: ${{ steps.metadata.outputs.promotion_ghcr_tags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"; short_sha="${sha::12}"
          tree_sitter_version="$(sed -n 's/^ARG TREE_SITTER_CLI_VERSION=//p' Dockerfile)"
          [[ "$tree_sitter_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tree-sitter CLI version: $tree_sitter_version" >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_call ]]; then tags="$RELEASE_VERSION,latest"
          else tags="latest,main-$short_sha"; fi
          hub_promotion=""; ghcr_promotion=""
          IFS=',' read -r -a tag_entries <<< "$tags"
          for raw_tag in "${tag_entries[@]}"; do
            tag="$(echo "$raw_tag" | xargs)"; [[ -n "$tag" ]] || continue
            [[ "$tag" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]] || { echo "Invalid Docker tag: $tag" >&2; exit 1; }
            hub_promotion+="${DOCKER_IMAGE}:${tag}"$'\n'; ghcr_promotion+="ghcr.io/${DOCKER_IMAGE}:${tag}"$'\n'
          done
          [[ -n "$hub_promotion" ]] || { echo "At least one Docker tag is required" >&2; exit 1; }
          candidate="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "sha=$sha"; echo "tree_sitter_version=$tree_sitter_version"; echo "cache_scope=release-$short_sha"
            echo "candidate_hub_tags<<EOF"; echo "${DOCKER_IMAGE}:$candidate"; echo EOF
            echo "candidate_ghcr_tags<<EOF"; echo "ghcr.io/${DOCKER_IMAGE}:$candidate"; echo EOF
            echo "promotion_hub_tags<<EOF"; printf '%s' "$hub_promotion"; echo EOF
            echo "promotion_ghcr_tags<<EOF"; printf '%s' "$ghcr_promotion"; echo EOF
          } >> "$GITHUB_OUTPUT"

  type_check_changed:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run type-check:changed

  type_check_full:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run type-check:full

  checks:
    needs: [prepare, type_check_changed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: npm ci
      - run: npm run check:ci-node-versions
      - run: npm run build
      - run: npm run lint
      - run: npm run test:workflows
      - run: npm test
      - run: npm run validate-module-imports
      - run: test -f dist/kaseki-api-service.js

  docker_integration:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - run: npm ci
      - run: bash tests/docker-integration-shared-image.test.sh
      - run: npm run test:integration:docker
      - name: Diagnose Docker integration failure
        if: failure()
        run: |
          set +e
          echo '--- runner memory ---'
          free -h
          echo '--- runner disk ---'
          df -h
          echo '--- Docker disk usage ---'
          docker system df
          echo '--- Docker containers ---'
          docker ps -a
          echo '--- cgroup memory ---'
          for file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
            if [ -r "$file" ]; then
              echo "[$file]"
              cat "$file"
            fi
          done

  build_candidate:
    needs: [prepare, checks, type_check_full, docker_integration]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.prepare.outputs.candidate_hub_tags }}
            ${{ needs.prepare.outputs.candidate_ghcr_tags }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.cache_scope }}
          cache-to: type=gha,scope=${{ needs.prepare.outputs.cache_scope }},mode=max
          provenance: true
          sbom: true

  scan:
    needs: build_candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # SARIF output is intentionally non-gating: Trivy otherwise returns exit
      # code 1 without printing the findings that caused it. The JSON report
      # below is summarized and becomes the explicit promotion gate.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/${{ env.DOCKER_IMAGE }}@${{ needs.build_candidate.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/${{ env.DOCKER_IMAGE }}@${{ needs.build_candidate.outputs.digest }}
          format: json
          output: trivy-results.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Fail on Trivy high/critical findings
        shell: bash
        run: |
          set -euo pipefail
          finding_count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)"
          if (( finding_count == 0 )); then
            echo 'No unfixed high/critical vulnerabilities found.'
            exit 0
          fi
          echo "::error title=Trivy high/critical findings::$finding_count unfixed high/critical vulnerabilities found"
          jq -r '.Results[]?.Vulnerabilities[]? | [ .Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "no fixed version") ] | @tsv' trivy-results.json
          exit 1
      - if: always()
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          sarif_file: trivy-results.sarif
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulnerability-scan-results
          path: |-
            trivy-results.sarif
            trivy-results.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    needs: [prepare, build_candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Docker Hub candidate
        env:
          DOCKER_HUB_CANDIDATE_IMAGE: docker.io/${{ env.DOCKER_IMAGE }}@${{ needs.build_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker manifest inspect "$DOCKER_HUB_CANDIDATE_IMAGE" | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")'
          # tree-sitter is architecture-specific and can hang under QEMU. Its
          # pinned version is verified from Dockerfile/installer contracts;
          # check candidate packaging without invoking the binary.
          docker run --rm --entrypoint /bin/sh "$DOCKER_HUB_CANDIDATE_IMAGE" -c 'test -x /usr/local/bin/tree-sitter'
          docker run --rm --entrypoint pi "$DOCKER_HUB_CANDIDATE_IMAGE" --version
          workspace="$(mktemp -d)"; results="$(mktemp -d)"; trap 'rm -rf "$workspace" "$results"' EXIT; chmod 0777 "$workspace" "$results"
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /agents:rw,nosuid,nodev,size=512m --security-opt no-new-privileges:true --cap-drop ALL -e KASEKI_INSTANCE=kaseki-smoke -e KASEKI_STARTUP_CHECK_MODE=baseline-validation -v "$workspace:/workspace:rw" -v "$results:/results:rw" -w /workspace "$DOCKER_HUB_CANDIDATE_IMAGE" bash -lc 'set -euo pipefail; test -d /agents/kaseki-template; test -d /agents/kaseki-runs; test -d /results; test -x /scripts/startup-checks.sh; test -x /usr/local/bin/kaseki-entrypoint; test -x /usr/local/bin/kaseki-agent; test -x /usr/local/bin/kaseki-report; node --version; git --version; pi --version'
          test ! -d "$workspace/repo"; docker run --rm --entrypoint kaseki-report -v "$results:/results:ro" "$DOCKER_HUB_CANDIDATE_IMAGE" /results
      - name: Verify GHCR candidate
        env:
          GHCR_CANDIDATE_IMAGE: ghcr.io/${{ env.DOCKER_IMAGE }}@${{ needs.build_candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker manifest inspect "$GHCR_CANDIDATE_IMAGE" | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")'
          # See the Docker Hub verification above: avoid executing this
          # architecture-specific CLI under QEMU.
          docker run --rm --entrypoint /bin/sh "$GHCR_CANDIDATE_IMAGE" -c 'test -x /usr/local/bin/tree-sitter'
          docker run --rm --entrypoint pi "$GHCR_CANDIDATE_IMAGE" --version

  promote:
    needs: [prepare, build_candidate, verify, scan]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified immutable digest
        env:
          DIGEST: ${{ needs.build_candidate.outputs.digest }}
          HUB_TAGS: ${{ needs.prepare.outputs.promotion_hub_tags }}
          GHCR_TAGS: ${{ needs.prepare.outputs.promotion_ghcr_tags }}
        run: |
          set -euo pipefail
          for tags in "$HUB_TAGS" "$GHCR_TAGS"; do
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              docker buildx imagetools create --tag "$tag" "${tag%:*}@${DIGEST}"
            done <<< "$tags"
          done
