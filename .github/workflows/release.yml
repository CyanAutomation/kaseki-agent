name: Create A Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run (preview only, no tags/releases created)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      recover_version:
        description: "Republish artifacts for an existing release version (for example, 1.158.0)"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Validate release request
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RECOVER_VERSION: ${{ inputs.recover_version }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true && -n "$RECOVER_VERSION" ]]; then
            echo "Choose either dry-run or recovery mode, not both." >&2
            exit 1
          fi
          if [[ -n "$RECOVER_VERSION" && ! "$RECOVER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Recovery version must be a semantic version without a leading v." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Bun for target repository tests
        run: |
          bun_version=$(node <<'NODE'
          const bunVersion = require("./docker/image-toolchain/package.json").dependencies?.bun;
          const semver = require("semver");
          if (typeof bunVersion !== "string" || semver.valid(bunVersion) !== bunVersion) {
            console.error("ERROR: dependencies.bun in docker/image-toolchain/package.json must be an exact semantic version");
            process.exit(1);
          }
          process.stdout.write(bunVersion);
          NODE
          )
          npm install --prefix "$RUNNER_TEMP/kaseki-bun" --no-audit "bun@$bun_version"
          echo "$RUNNER_TEMP/kaseki-bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run release validation suite
        run: npm run test:ci

      - name: Validate workflow contracts
        run: npm run test:workflows

      - name: Publish smoke test
        run: npm run test:publish-smoke

      - name: Fallow - Codebase Intelligence
        uses: fallow-rs/fallow@7efec6de07a5aff41d8e047cab2734d69580d2fc # v2.95.0
        with:
          version: "2.95.0"
          command: health
          score: true
          fail-on-issues: false
          hotspots: true
          targets: true
          save-snapshot: true

  dry_run:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm run release:dry 2>&1 | tee release-output.log

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-output
          path: release-output.log
          retention-days: 30

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write # Create semantic-release tags, commits, and GitHub releases.
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release or recovery target
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RECOVER_VERSION: ${{ inputs.recover_version }}
        run: |
          set -euo pipefail
          released=false
          new_tag=''
          release_sha=''

          if [[ -n "$RECOVER_VERSION" ]]; then
            recovery_target="$(./scripts/resolve-existing-release.sh "$RECOVER_VERSION")"
            new_tag="v$(printf '%s\n' "$recovery_target" | sed -n 's/^version=//p')"
            release_sha="$(printf '%s\n' "$recovery_target" | sed -n 's/^sha=//p')"
            released=true
          else
            before_tags="$(mktemp)"
            after_tags="$(mktemp)"
            trap 'rm -f "$before_tags" "$after_tags"' EXIT
            # comm requires bytewise ordered inputs; version sorting is incompatible.
            source scripts/release-tag-detection.sh
            release_tag_snapshot > "$before_tags"
            npm run release 2>&1 | tee release-output.log
            release_tag_snapshot > "$after_tags"
            new_tag="$(detect_new_release_tag "$before_tags" "$after_tags")"
          fi

          if [[ -n "$new_tag" ]]; then
            release_sha="${release_sha:-$(git rev-list -n 1 "$new_tag")}"
            if [[ -z "$RECOVER_VERSION" ]]; then
              [[ "$release_sha" == "$(git rev-parse HEAD)" ]] || {
                echo "New release tag $new_tag does not point at HEAD" >&2
                exit 1
              }
            fi
            released=true
          fi
          {
            echo "released=$released"
            if [[ "$released" == "true" ]]; then
              echo "version=${new_tag#v}"
              echo "sha=$release_sha"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Publish Raspberry Pi bootstrap bundle
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          archive='kaseki-agent-source.tar.gz'
          git archive --format=tar.gz --output "$archive" "$RELEASE_SHA"
          sha256sum "$archive" > "$archive.sha256"
          git show "$RELEASE_SHA:scripts/bootstrap-pi.sh" > ./bootstrap-pi.sh
          sha256sum bootstrap-pi.sh > bootstrap-pi.sh.sha256
          gh release upload --clobber "v$RELEASE_VERSION" "$archive" "$archive.sha256" bootstrap-pi.sh bootstrap-pi.sh.sha256

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-output
          path: release-output.log
          retention-days: 30

  publish_npm:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write # Request npm trusted-publishing credentials in the reusable workflow.
    uses: ./.github/workflows/publish-npm.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
      allow_existing: ${{ inputs.recover_version != '' }}

  publish_docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write # Publish verified candidate and promoted Docker images.
      security-events: write # Upload Trivy results from the reusable workflow.
    uses: ./.github/workflows/build-docker-image.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
      recovery: ${{ inputs.recover_version != '' }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
