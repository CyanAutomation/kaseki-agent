name: Create A Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry-run (preview only, no tags/releases created)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Full history for semantic-release

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release validation suite
        run: npm run test:ci

      - name: Validate workflow contracts
        run: npm run test:workflows

      - name: Publish smoke test
        run: npm run test:publish-smoke

      - name: Fallow - Codebase Intelligence
        uses: fallow-rs/fallow@7efec6de07a5aff41d8e047cab2734d69580d2fc # v2.95.0
        with:
          version: "2.95.0"
          command: health
          score: true
          fail-on-issues: false
          hotspots: true
          targets: true
          save-snapshot: true

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before_tags="$(mktemp)"
          after_tags="$(mktemp)"
          trap 'rm -f "$before_tags" "$after_tags"' EXIT
          git tag --list 'v[0-9]*' | sort -V > "$before_tags"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            npm run release:dry 2>&1 | tee release-output.log
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            npm run release 2>&1 | tee release-output.log
            git tag --list 'v[0-9]*' | sort -V > "$after_tags"
            new_tag="$(comm -13 "$before_tags" "$after_tags" | tail -n 1)"
            if [[ -n "$new_tag" ]]; then
              release_sha="$(git rev-list -n 1 "$new_tag")"
              [[ "$release_sha" == "$(git rev-parse HEAD)" ]] || {
                echo "New release tag $new_tag does not point at HEAD" >&2
                exit 1
              }
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "version=${new_tag#v}" >> "$GITHUB_OUTPUT"
              echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
            else
              echo "released=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-output
          path: release-output.log
          retention-days: 30

  # publish_npm:
  #   needs: release
  #   if: needs.release.outputs.released == 'true'
  #   permissions:
  #     contents: read
  #     id-token: write
  #   uses: ./.github/workflows/publish-npm.yml
  #   with:
  #     ref: ${{ needs.release.outputs.sha }}
  #     version: ${{ needs.release.outputs.version }}
  #   secrets: inherit

  publish_docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build-docker-image.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
